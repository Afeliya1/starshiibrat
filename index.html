9243,900,600),credit:"Rhys Abel / Pexels",duration:"0:18"},{title:"Утро в облаках",desc:"Рассвет над вершинами: море тумана и первые лучи солнца.",src:"https://videos.pexels.com/video-files/8201470/8201470-hd_1920_1080_30fps.mp4",poster:We(35523366,900,600),credit:"CESAR A RAMIREZ VALLEJO / Pexels",duration:"0:30"},{title:"Реки и ущелья",desc:"Бирюзовая вода Сулака, серпантины и скальные коридоры.",src:"https://videos.pexels.com/video-files/18090229/18090229-hd_1920_1080_25fps.mp4",poster:We(9885821,900,600),credit:"Alper Adıgüzel / Pexels",duration:"0:21"}],Ji={src:"https://videos.pexels.com/video-files/8201470/8201470-hd_1920_1080_30fps.mp4",poster:We(9675972,1600,900),credit:"CESAR A RAMIREZ VALLEJO / Pexels"},Hs=(t,i="jpeg")=>`https://images.pexels.com/photos/${t}/pexels-photo-${t}.${i}?auto=compress&cs=tinysrgb&w=200&h=200&fit=crop`,Xd=[{id:1,name:"Анна Ковалёва",city:"Москва",tour:"Знакомство, 3 дня",date:"Сентябрь 2025",rating:5,avatar:Hs(3936894),text:"Это была лучшая поездка за последние годы. Наш гид Магомед рассказывал о каждом ауле так, будто мы приехали к его родственникам — и это почти правда: нас действительно принимали в гостях, кормили домашним чуду и показывали места, которых нет ни в одном путеводителе. Сулакский каньон с воды — мурашки по коже. Отдельное спасибо за организацию: ни одной накладки, всё по минутам, комфортный микроавтобус и отели с видом на горы.",photos:[9675972,9873593,29143171]},{id:2,name:"Дмитрий Ерёмин",city:"Санкт-Петербург",tour:"Горный Дагестан, 4 дня",date:"Июль 2025",rating:5,avatar:Hs(14950779),text:"Брали экстремальный маршрут с джипингом и Карадахской тесниной. Водители — профессионалы, на серпантинах ни разу не было страшно. Организация на уровне хорошей европейской компании, но с настоящим кавказским гостеприимством: нас кормили так, что ужинать в отеле уже не хотелось. Обязательно вернёмся на «Высоту гор».",photos:[12453700,10558304,37612879]},{id:3,name:"Марина и Сергей Логиновы",city:"Казань",tour:"Новогодняя сказка, 5 дней",date:"Январь 2026",rating:5,avatar:Hs(16869444),text:"Встречали Новый год в Гунибе с двумя детьми. Банкет, лезгинка, салют над снежными террасами, а утром — снегоходы и баня на дровах. Детям 7 и 11 лет было интересно всё время, никто не ныл ни разу, что для нашей семьи рекорд. Спасибо «Старшему Брату» за заботу: нам даже подобрали детское меню и тёплые пледы в машину.",photos:[30669289,35523366,37879986]},{id:4,name:"Ильдар Хайруллин",city:"Уфа",tour:"Восхождение, 5 дней",date:"Август 2025",rating:5,avatar:Hs(29615996,"png"),text:"Ходил на Шалбуздаг с инструкторами ТурСТ. Снаряжение в порядке, группа маленькая, темп подбирали под самого неподготовленного. На вершине были ровно к рассвету — такого неба я не видел никогда. Важно, что ребята реально думают о безопасности: на середине подъёма развернули участника, которому стало плохо, и это было правильное решение.",photos:[14572954,19955386,24879594]},{id:5,name:"Ольга Назарова",city:"Екатеринбург",tour:"Южный Дагестан, 5 дней",date:"Май 2025",rating:5,avatar:Hs(35490806),text:"Дербент — любовь с первого взгляда. Гуляли по старому городу с местным историком, видели Самурский лиановый лес и экраноплан «Лунь». Очень понравилась прозрачность: цена в договоре совпала с итоговой до рубля, никаких «доплат на месте». Рекомендую этот тур тем, кто едет в Дагестан впервые и хочет увидеть всё главное.",photos:[30653164,9950462,36595887]},{id:6,name:"Артём Гаврилов",city:"Новосибирск",tour:"Конструктор тура, 6 дней",date:"Октябрь 2025",rating:5,avatar:Hs(804009),text:"Собрали маршрут под нас четверых: рыбалка на Сулаке, фотосессия в Гамсутле и два дня в горах без связи. Менеджер Ася терпеливо переделывала программу раз пять, пока всё не стало идеально. Единственное — очень хотелось бы чуть больше свободного времени в Дербенте, но это уже вопрос наших аппетитов. В остальном — 10 из 10.",photos:[8577817,9674386,9943237]}],a6=[{id:1,cat:"Советы",title:"10 мест Дагестана, которые нужно увидеть хотя бы раз в жизни",excerpt:"Сулакский каньон глубже Гранд-Каньона, а Гамсутль называют «мертвым городом». Собрали честный список локаций без туристической мишуры.",date:"12 февраля 2026",read:"8 мин",image:9675971,credit:"Nadezhda Moryak / Pexels"},{id:2,cat:"История",title:"Гамсутль: почему аул на вершине опустел за 40 лет",excerpt:"История села, которому больше двух тысяч лет: от неприступной крепости до последнего жителя и тишины, которую слышно с перевала.",date:"28 января 2026",read:"11 мин",image:8643542,credit:"Alexander Gorodilov / Pexels"},{id:3,cat:"Маршруты",title:"Что взять в горы Дагестана: чек-лист гида на 3 дня",excerpt:"Правильная обувь, слой одежды и мелочи, о которых забывают 8 из 10 туристов. Список собран нашими инструкторами за 10 сезонов.",date:"15 января 2026",read:"6 мин",image:24879594,credit:"Artūras Kokorevas / Pexels"}],Gn=[{q:"Как забронировать тур?",a:"Оставьте заявку на сайте или позвоните. Менеджер свяжется в течение 15 минут, подтвердит даты и вышлет договор. Бронь фиксируется предоплатой 20%."},{q:"Что входит в стоимость?",a:"Транспорт, проживание, питание по программе, услуги гида, входные билеты, страховка и трансфер из аэропорта Махачкалы. Авиабилеты до Махачкалы оплачиваются отдельно — поможем подобрать."},{q:"Можно ли с детьми?",a:"Да. Маршруты «В гостях у горцев», «Знакомство» и «Новогодняя сказка» подходят для детей от 5 лет. Для малышей подберем щадящий график и автокресло."},{q:"Нужны ли пропуски в погранзону?",a:"Для части маршрутов Южного Дагестана нужен пропуск. Мы оформляем его сами за 7–10 дней — от вас потребуется только скан паспорта."},{q:"Какие условия отмены?",a:"Бесплатная отмена за 7 дней до старта — возвращаем 100%. При отмене менее чем за 72 часа удерживаются фактические расходы (обычно не более 30%)."},{q:"Есть ли рассрочка?",a:"Да, рассрочка 0% на 4 месяца от банков-партнёров, а также оплата по счёту для юрлиц с закрывающими документами."},{q:"Где вы находитесь?",a:"Наш офис в Избербаше: ул. 2-я Магистральная, д. 2 — 10 минут от побережья Каспия и около 40 минут от аэропорта Махачкалы. Работаем ежедневно с 10:00 до 20:00: заезжайте на чай, покажем фото с маршрутов и соберём поездку под ваши даты."}],Ab=[{value:12,suffix:"+",label:"лет показываем Дагестан"},{value:5400,suffix:"+",label:"довольных туристов"},{value:48,suffix:"",label:"авторских маршрутов"},{value:100,suffix:"%",label:"гарантия по договору"}],o1=[{id:"sulak",name:"Сулакский каньон",img:8577817,base:9e3,credit:"Adam Khasbulatov / Pexels"},{id:"gamzutl",name:"Гамсутль и Гуниб",img:9873593,base:11e3,credit:"cottonbro studio / Pexels"},{id:"khunzakh",name:"Хунзах и Тобот",img:6272246,base:10500,credit:"Enric Cruz López / Pexels"},{id:"derbent",name:"Дербент и юг",img:30653164,base:9500,credit:"Aleksandr Sochnev / Pexels"},{id:"caspian",name:"Каспий и Избербаш",img:37879986,base:7500,credit:"Harsh Kukadiya / Pexels"},{id:"all",name:"Весь Дагестан",img:12453700,base:14e3,credit:"Pexels / Pexels"}],Zd=[{id:"transfer",label:"Трансфер из аэропорта",price:2500,icon:"bus"},{id:"food",label:"Питание полный пансион",price:1800,icon:"food"},{id:"guide",label:"Личный гид-историк",price:3500,icon:"map"},{id:"photo",label:"Фотосессия в горах",price:6e3,icon:"camera"},{id:"jeep",label:"Джипинг по бездорожью",price:4500,icon:"car"},{id:"spa",label:"Баня и спа-программа",price:3e3,icon:"spa"}],Kd=[{id:"home",label:"Главная"},{id:"tours",label:"Туры"},{id:"about",label:"О нас"},{id:"gallery",label:"Галерея"},{id:"reviews",label:"Отзывы"},{id:"contacts",label:"Контакты"}];var l6=b1();function Ze({children:t,delay:i=0,y:a=30,x:l=0,className:o,once:u=!0}){return c.jsx(ge.div,{className:o,initial:{opacity:0,y:a,x:l},whileInView:{opacity:1,y:0,x:0},viewport:{once:u,margin:"-70px"},transition:{duration:.7,delay:i,ease:[.22,1,.36,1]},children:t})}function Cf({children:t,strength:i=.32,className:a}){const l=R.useRef(null),o=Vo(0),u=Vo(0),f=r1(o,{stiffness:220,damping:16,mass:.4}),p=r1(u,{stiffness:220,damping:16,mass:.4}),m=dv();return c.jsx(ge.span,{ref:l,st       <input name="email" />

      <input name="email" />
      <input name="source" />
    </form>

    <div id="root"></div>
